[project]
name = "genai-krishnaik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohd Adil", email = "adil88.mohd@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.31.0",
    "langchain>=1.0,<2.0",
    "langchain-community>=0.3.31",
    "langchain-google-genai>=2.1.12",
    "langchain-groq>=0.3.8",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0,<2.0",
    "ollama>=0.6.3",
    "pip>=26.3",
    "pyppeteer>=0.0.25",
    "python-dotenv>=1.2.1",
]

[project.scripts]
genai-krishnaik = "genai_krishnaik:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
